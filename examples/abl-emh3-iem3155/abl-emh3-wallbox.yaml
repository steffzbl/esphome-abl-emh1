##############################################################################
# ABL eMH3 laadpaal + Schneider iEM3155 kWh-meter via ESP32 en 2x RS485
#
# Bedrading (zie handleiding / schema):
#   RS485-module 1 (ABL)      : GPIO17 -> DI, GPIO16 <- RO, GPIO4  -> DE+RE
#   RS485-module 2 (iEM3155)  : GPIO19 -> DI, GPIO18 <- RO, GPIO21 -> DE+RE
#   Beide modules             : 3V3 -> VCC, GND -> GND
##############################################################################

substitutions:
  name: abl-emh3-wallbox
  friendly_name: "ABL eMH3 Laadpaal"
  device_description: "ABL eMH3 laadpaal (Modbus-ASCII) + Schneider iEM3155 (Modbus-RTU)"
  external_components_source: github://steffzbl/esphome-abl-emh1@main

  # RS485-bus 1: ABL laadpaal
  abl_tx_pin: GPIO17
  abl_rx_pin: GPIO16
  abl_flow_control_pin: GPIO4

  # RS485-bus 2: Schneider iEM3155
  iem_tx_pin: GPIO19
  iem_rx_pin: GPIO18
  iem_flow_control_pin: GPIO21
  iem_address: "2"

  # Laadstroom-grenzen (A)
  wallbox_min_current: "6"
  wallbox_max_current: "15"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Abl-Emh3-Wallbox Fallback"
    password: !secret ap_fb_pw

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  # VERBOSE geeft veel Modbus-ruis in de log; zet tijdelijk terug bij debuggen.
  level: DEBUG

external_components:
  - source: ${external_components_source}
    refresh: never

##############################################################################
# UART CONFIGURATIE
##############################################################################

uart:
  # ABL laadpaal (Modbus-ASCII, 38400 8E1)
  - id: uart_bus
    tx_pin: ${abl_tx_pin}
    rx_pin: ${abl_rx_pin}
    baud_rate: 38400
    parity: EVEN
    stop_bits: 1

  # Schneider iEM3155 (Modbus-RTU, 19200 8E1)
  - id: uart_iem3155
    tx_pin: ${iem_tx_pin}
    rx_pin: ${iem_rx_pin}
    baud_rate: 19200
    parity: EVEN
    stop_bits: 1

##############################################################################
# ABL MODBUS
##############################################################################

emh1_modbus:
  uart_id: uart_bus
  flow_control_pin: ${abl_flow_control_pin}
  id: modbus0

abl_emh1:
  emh1_modbus_id: modbus0
  update_interval: 5s
  # Bij een reconnect (na ESP-herstart of een reset van de laadpaal zelf
  # terwijl de ESP online blijft) wordt eerst de laatst ingestelde stroom
  # hersteld (bv. via "Max Amps" of "Allow charging" in HA - onthouden in
  # het RAM van de ESP, overleeft dus geen ESP-herstart). Is er nog geen
  # eerdere waarde bekend (verse flash, of ESP zelf herstart), dan wordt
  # deze waarde als veilige terugval gebruikt. Zie: github://steffzbl/esphome-abl-emh1
  restart_max_current: 6.0

##############################################################################
# SCHNEIDER MODBUS RTU
##############################################################################

modbus:
  - id: modbus_iem3155
    uart_id: uart_iem3155
    flow_control_pin: ${iem_flow_control_pin}

modbus_controller:
  - id: iem3155
    modbus_id: modbus_iem3155
    address: ${iem_address}
    update_interval: 5s

##############################################################################
# PREFERENCES
##############################################################################

preferences:
  flash_write_interval: 5min

##############################################################################
# BINARY SENSORS / BUTTONS
##############################################################################

binary_sensor:
  - platform: status
    name: "Online"

button:
  - platform: restart
    name: "Herstart ESP"

##############################################################################
# TEXT SENSORS
##############################################################################

text_sensor:
  - platform: abl_emh1
    mode:
      name: "Status"

    serial_number:
      name: "Serial number"
      disabled_by_default: true

  - platform: template
    name: Chargemode
    id: chargemode
    icon: mdi:car
    update_interval: 5s
    disabled_by_default: true
    lambda: |-
      int phaseCnt = 0;

      if (id(outlet_state).state == 0xC2) {
        if (id(l1_current).state > 1.0) phaseCnt++;
        if (id(l2_current).state > 1.0) phaseCnt++;
        if (id(l3_current).state > 1.0) phaseCnt++;
      }

      switch (phaseCnt) {
        case 0:
          return {"None"};
        case 1:
          return {"1 Phase"};
        default:
          return {"3 Phase"};
      }

##############################################################################
# SENSOREN
##############################################################################

sensor:

  ###########################################################################
  # ABL
  ###########################################################################

  - platform: abl_emh1
    l1_current:
      name: "L1 current"
      state_class: measurement
      accuracy_decimals: 1
      id: l1_current

    l2_current:
      name: "L2 current"
      state_class: measurement
      accuracy_decimals: 1
      id: l2_current

    l3_current:
      name: "L3 current"
      state_class: measurement
      accuracy_decimals: 1
      id: l3_current

    max_current:
      name: "Max current"
      state_class: measurement
      id: max_current
      accuracy_decimals: 1
      disabled_by_default: true

    en1_status:
      name: "EN1 status"
      disabled_by_default: true

    en2_status:
      name: "EN2 status"
      disabled_by_default: true

    duty_cycle_reduced:
      name: "Reduced Duty Cycle"
      disabled_by_default: true

    ucp_status:
      name: "Ucp Status <= 10V"
      disabled_by_default: true

    outlet_state:
      name: "Outlet state"
      disabled_by_default: true
      id: outlet_state

    charging_allowed:
      name: "Charging allowed"
      disabled_by_default: true
      id: charging_allowed

  - platform: uptime
    name: Uptime Sensor
    id: abl_uptime
    update_interval: 15s

  - platform: wifi_signal
    name: "WiFi signaal"
    update_interval: 60s
    entity_category: diagnostic

  ###########################################################################
  # SCHNEIDER IEM3155
  # Registeradressen zijn 0-based (datasheet-adres min 1).
  ###########################################################################

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Voltage L1"
    address: 3027
    register_type: holding
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Voltage L2"
    address: 3029
    register_type: holding
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Voltage L3"
    address: 3031
    register_type: holding
    value_type: FP32
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Current L1"
    address: 2999
    register_type: holding
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Current L2"
    address: 3001
    register_type: holding
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Current L3"
    address: 3003
    register_type: holding
    value_type: FP32
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - throttle_average: 30s

  # Vermogen per fase (register in kW -> omrekenen naar W)
  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Active Power L1"
    address: 3053
    register_type: holding
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 1000
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Active Power L2"
    address: 3055
    register_type: holding
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 1000
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Active Power L3"
    address: 3057
    register_type: holding
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 1000
      - throttle_average: 30s

  # Was adres 3053 = alleen fase L1. Totaal vermogen (alle fasen) = 3059.
  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Active Power"
    address: 3059
    register_type: holding
    value_type: FP32
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 1000
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: iem3155
    name: "IEM3155 Total Energy"
    # Was address 3206 as U_WORD (16-bit, max 65535) - that overflows back
    # to 0 at 65.535 kWh, causing the weekly reset. Correct register for
    # cumulative total active energy import on this meter is 45099 as FP32
    # (already in kWh, no multiply needed).
    # See: https://github.com/htvekov/iem3155_esphome
    address: 45099
    register_type: holding
    value_type: FP32
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

##############################################################################
# STROOMINSTELLING LAADPAAL
##############################################################################

number:
  - platform: template
    name: "Max Amps"
    id: set_current
    icon: mdi:arrow-oscillating
    min_value: ${wallbox_min_current}
    max_value: ${wallbox_max_current}
    step: 1
    unit_of_measurement: A
    optimistic: false
    update_interval: 10s
    lambda: |-
      // Geen geldige waarde van de laadpaal -> niets publiceren
      if (std::isnan(id(max_current).state)) return {};
      return (float) std::lround(id(max_current).state);

    set_action:
      lambda: |-
        ESP_LOGD("main", "Sending modbus value = %.2f", x);
        id(modbus0)->send_current(x);

##############################################################################
# SWITCHES
##############################################################################

switch:
  - platform: template
    name: "Enable"
    id: enable_switch
    icon: mdi:power
    restore_mode: DISABLED

    lambda: |-
      // Onbekende status (bv. net opgestart) -> niet als "aan" melden
      if (std::isnan(id(outlet_state).state)) return {};
      return (id(outlet_state).state != 0xE0);

    turn_off_action:
      - lambda: |-
          if ((id(abl_uptime).state > 10.0) &&
              (!std::isnan(id(outlet_state).state)))
            id(modbus0)->send_enable(0);

    turn_on_action:
      - lambda: |-
          if ((id(abl_uptime).state > 10.0) &&
              (!std::isnan(id(outlet_state).state)))
            id(modbus0)->send_enable(1);

  - platform: template
    name: "Allow charging"
    id: allow_charging_switch
    icon: mdi:ev-station
    restore_mode: DISABLED

    lambda: |-
      if (std::isnan(id(charging_allowed).state)) return {};
      return id(charging_allowed).state == 1;

    turn_on_action:
      - lambda: |-
          if (std::isnan(id(outlet_state).state)) return;

          int state = std::lround(id(charging_allowed).state);

          ESP_LOGD("main",
                   "Allow charging turn on. Current state is: %d",
                   state);

          // Gebruik de ingestelde "Max Amps"; val terug op het maximum
          float amps = id(set_current).state;
          if (std::isnan(amps) || amps < ${wallbox_min_current})
            amps = ${wallbox_max_current};

          if (state <= 0)
            id(modbus0)->send_current(amps);

    turn_off_action:
      - lambda: |-
          if (std::isnan(id(outlet_state).state)) return;

          int state = std::lround(id(charging_allowed).state);

          ESP_LOGD("main",
                   "Allow charging turn off. Current state is: %d",
                   state);

          if (state > 0)
            id(modbus0)->send_charging_disable();
